name: Update streak and contribution graph

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/streak.yml"
      - "scripts/generate_streak_svg.py"

permissions:
  contents: write

jobs:
  update-graphs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        env:
          GH_TOKEN: ${{ secrets.STREAK_PAT }}
          STREAK_USERNAME: utsav8143
        run: python scripts/generate_streak_svg.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg assets/contribution-graph.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update streak and contribution graph"

          # Another workflow (e.g. snake.yml) may push to main around the
          # same time. Retry with rebase a few times before giving up.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push rejected, retrying ($i/5)..."
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 1))
          done

          echo "Failed to push after retries"
          exit 1
