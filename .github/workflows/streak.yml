name: Update streak and contribution graph

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/streak.yml"
      - "scripts/generate_streak_svg.py"

permissions:
  contents: write

jobs:
  update-graphs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        env:
          GH_TOKEN: ${{ secrets.STREAK_PAT }}
          STREAK_USERNAME: utsav8143
        run: python scripts/generate_streak_svg.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg assets/contribution-graph.svg
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update streak and contribution graph"
          git push
